run:
  duration: 8.0  # Standalone tendon simulation duration in seconds when --duration is not passed.
  status_interval: 100  # Print one progress line every N simulation steps.
  startup_hold_enabled: true  # Hold initial measured joint targets before starting the gait controller.
  startup_hold_duration: 2.0  # Startup hold duration in seconds.
  controller: "sin"  # Default open-loop controller for scripts/tendons/run.py: "sin" or "cpg".
  constraint_mode: "boom"  # Base constraint for scripts/tendons/run.py: "freefall", "boom", or "static".
  cpg:
    f_hz: 1.5  # CPG cycle frequency in Hz.
    duty_factor: 0.60  # Fraction of the gait cycle spent in stance.
    hip_amplitude_deg: 32.0  # Hip flexion sinusoid amplitude.
    hip_offset_deg: 22.0  # Hip flexion offset.
    knee_amplitude_deg: 120.0  # Knee flexion swing amplitude.
    swing_start_offset: 0.02  # Phase offset after stance before knee swing starts.
    swing_end_offset: 0.05  # Phase offset before cycle end where knee swing stops.
    combined_phase_offset_rad: 1.5707963267948966  # Common phase offset added to both legs.
    left_phase_offset_rad: -1.5707963267948966  # Left leg phase offset before common offset.
    right_phase_offset_rad: 1.5707963267948966  # Right leg phase offset before common offset.
    include_knee: true  # Include knee flexion command in the CPG controller.
  sinusoidal:
    f_hz: 0.8  # Sinusoidal controller frequency in Hz.
    left_phi0_rad: 0.0  # Left leg base phase offset.
    right_phi0_rad: 3.141592653589793  # Right leg base phase offset.
    amplitude_deg:
      hip_roll: 0.0
      hip_yaw: 0.0
      hip_flexion: 24.0
      knee_flexion: 34.0
    offset_deg:
      hip_roll: 0.0
      hip_yaw: 0.0
      hip_flexion: 8.0
      knee_flexion: 34.0
    left_phase_rad:
      hip_flexion: 0.0
      knee_flexion: 1.5707963267948966
    right_phase_rad:
      hip_flexion: 0.0
      knee_flexion: 1.5707963267948966
  output_dir: "outputs"  # Directory for debug JSONL logs and generated artifacts.
  video_output: "outputs/simulation.mp4"  # Default MP4 path when video recording is enabled.
